<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="studioGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0C0C0F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="8" fill="#0C0C0F" />
  <rect width="32" height="32" rx="8" stroke="#2E2E34" stroke-width="1.2" />

  <!-- Subtle glow -->
  <circle cx="16" cy="16" r="10" fill="url(#lensGlow)" />

  <!-- Aperture icon blades -->
  <g stroke="url(#studioGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="10.5" />
    <line x1="24.5" y1="11.5" x2="16.5" y2="25.5" />
    <line x1="16.5" y1="6.5" x2="8.5" y2="20.5" />
    <line x1="7.5" y1="11.5" x2="23.5" y2="20.5" />
  </g>

  <!-- Center lens spotlight core -->
  <circle cx="16" cy="16" r="2.2" fill="#F59E0B" />
</svg>

